<body>

    <section>

        <div class="card">
            <h1>Basico</h1>
            <p class="precio">$19.99</p>
            <p>1 usuario</p>
            <p>10GB de almacenamiento</p>
            <p>Soporte básico</p>

            <button type="submit">Comprar</button>

        </div>

        <div class="card">
            <h1>Pro</h1>
            <p class="precio">$19.99</p>

            <p>5 usuario</p>

            <div class="boton">
                <button type="submit">Comprar</button>
            </div>


        </div>

        <div class="card">
            <h1>Premium</h1>
            <p class="precio">$19.99</p>
            <p>Usuarios ilimitados</p>

            <button type="submit">Comprar</button>

        </div>
