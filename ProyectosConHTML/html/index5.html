<!--Enunciado:
Crea una barra lateral que contega un articulo, ese articulo
debera tener un titulo, fecha y un parrafo.

-->

<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Document</title>
</head>

<body>

    <aside>
        <article>
            <h2>Titulo</h2>

            <!--Esta etiqueta da mas semntica sobre las fechas-->
            <time datetime="20/08/2025"> 20 de Agosto del 2025</time>

            <p>Lorem ipsum dolor sit amet consectetur adipisicing elit. Corporis nam ea placeat ex voluptatum, et
                delectus magnam, aperiam beatae dolores quo iusto accusamus aspernatur laudantium aliquam ad eos
                voluptatem illo?</p>

        </article>
    </aside>

</body>

</html>
