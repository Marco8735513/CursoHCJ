<!--

Enunciado:

Crea un elemento principal con una sección que contenga un articulo,
el articulo debera tener un titulo, subtitulo y parrafo y pon  lineas negras de division
hr

-->

<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Document</title>
</head>

<body>

    <!--La etiqueta main es la que define el contenido principal-->
    <!--Es igual que un div pero tiene mejor semantica-->
    <!--Indica que es el contenido mas importante o el contenido principal-->
    <!--Solo puede haber un main por pagina-->
    <!--Dentro del contenido main se pueden indicar muchas secciones-->
    <main>
        <section>

            <article>

                <h2>Titulo</h2> 

                <h3>Subtitulo</h3>

                <p>Parrafo</p>

                <hr>
            </article>

            
            <article>

                <h2>Titulo</h2> 

                <h3>Subtitulo</h3>

                <p>Parrafo</p>

                <hr>
            </article>
            

            <article>

                <h2>Titulo</h2> 

                <h3>Subtitulo</h3>

                <p>Parrafo</p>

                <hr>

            </article>

        </section>

    </main>

</body>

</html>
