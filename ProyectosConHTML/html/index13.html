<!--Enunciado
Añade un video que se reproduzca nada mas cargar la pagina, el video debera estar silenciado, debera tener una miniatura, 500px de ancho y 300 de alto

-->

<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Document</title>
</head>
<body>

    <!--Etiqueta para poder poner videos en html5 -->
    
    <!--los controls son para que me salga la barra de busqueda y pueda ponerle play y todas las funciones de un video-->

    <!--autoplay sirve para que el video se reproduzca en cuanto empieza la pagina-->

    <!--muted es para que el video no tenga sonido cuando inicie la pagina-->

    <!--poster es la imagen que quieres que aparezca cuando inicia el video-->

    <video width="500px" height="300px" src="/Recursos/video/libro.mp4"
    controls   
    autoplay 
    muted
    poster="/Recursos/img/bmw-m50.jpg">


    </video>

</body>
</html>
