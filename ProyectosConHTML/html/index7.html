<!--Enunciado:
Crea una web que tenga una cabecera, contenido principal, barra lateral
y pie de pagina. Dentro debe de tener el contenido lógico de ese tipo de
elementos de una web.

-->



<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Document</title>
</head>
<body>
    
    <header>

        <h1>Titulo</h1>

        <nav>

            <ul>
                <li><a href="#">Inicio</a></li>
                <li><a href="#">Contacto</a></li>
                <li><a href="#">Salir</a></li>

            </ul>

        </nav>

    </header>

    <main>

        <h2>Mira esta sección</h2>

        <section>

            <article>
                <p>Esto es un parrafo</p>

            </article>

        </section>

    </main>

    <aside>
    
        <div>
            <h3>Esto es un buscador</h3>
            <form>
                <input type="text">
                <button type="submit">Buscar</button>
            </form>

        </div>
    
    </aside>

    <footer>
        <hr>
        Pie de Pagina <time datetime="2025"> 2025 &copy;</time>
    
    </footer>

</body>
</html>
