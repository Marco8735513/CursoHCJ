<!--Crea una lista de definición de frutas-->

<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Document</title>
</head>
<body>
    
    <h1>Lista de definición</h1>

    <!--La etiqueta dl es una lista de definición aquí definimos el termino y la descripción -->

    <!--dl significa description list-->
    
    <dl>

        <!--dt significa description term, podemos verlo como el termino-->
        <dt>¿Que es HTML?</dt>

        <!--Esta ya es la definición-->
        <dd>Lenguaje de marcado para estructurar paginas web</dd>

        <br> <!--Este recordemos que es un espacio-->

        <dt>¿Cuanto tarda el envio?</dt>
        <dd>De dos a tres dias</dd>


    </dl>


</body>
</html>
